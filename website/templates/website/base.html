<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ name }} - {{ title }}</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-purple: #8b5cf6;
            --deep-purple: #7c3aed;
            --dark-purple: #5b21b6;
            --light-purple: #a78bfa;
            --pure-black: #000000;
            --soft-black: #111111;
            --charcoal: #1a1a1a;
            --pure-white: #ffffff;
            --off-white: #fafafa;
            --light-gray: #f5f5f5;
            --text-gray: #888888;
            --border-gray: #2a2a2a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--pure-black);
            color: var(--pure-white);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--pure-black);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary-purple);
            border-radius: 3px;
        }

        /* Custom text selection */
        ::selection {
            background: var(--primary-purple);
            color: var(--pure-white);
            text-shadow: none;
        }

        ::-moz-selection {
            background: var(--primary-purple);
            color: var(--pure-white);
            text-shadow: none;
        }

        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-gray);
            z-index: 1000;
            transition: all 0.3s ease;
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1.5rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.2rem;
            font-weight: 500;
            color: var(--primary-purple);
            letter-spacing: -0.5px;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--pure-white);
            font-weight: 300;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            position: relative;
            padding: 0.5rem 1rem;
            border-radius: 20px;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 1px;
            bottom: 5px;
            left: 50%;
            background: var(--primary-purple);
            transition: all 0.3s ease;
            transform: translateX(-50%);
        }

        .nav-links a:hover::after {
            width: 80%;
        }

        .nav-links a:hover {
            color: var(--primary-purple);
            background: rgba(139, 92, 246, 0.1);
        }

        .nav-links a.active {
            background: var(--primary-purple);
            color: var(--pure-white);
        }

        /* Page specific content */
        .page-content {
            min-height: 100vh;
            padding-top: 120px;
        }

        .section {
            padding: 4rem 3rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .section-header {
            text-align: center;
            margin-bottom: 4rem;
        }

        .section-title {
            font-size: 2.5rem;
            font-weight: 200;
            margin-bottom: 1rem;
            letter-spacing: -1px;
            background: linear-gradient(135deg, var(--pure-white) 0%, var(--primary-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .section-subtitle {
            font-size: 1rem;
            color: var(--text-gray);
            font-weight: 300;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* Floating orbs background */
        .floating-orbs {
            position: fixed;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: -1;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, var(--primary-purple) 0%, transparent 70%);
            opacity: 0.05;
            animation: float 8s ease-in-out infinite;
        }

        .orb:nth-child(1) {
            width: 300px;
            height: 300px;
            top: 10%;
            left: -5%;
            animation-delay: 0s;
        }

        .orb:nth-child(2) {
            width: 200px;
            height: 200px;
            top: 50%;
            right: -5%;
            animation-delay: 3s;
        }

        .orb:nth-child(3) {
            width: 250px;
            height: 250px;
            bottom: 10%;
            left: 20%;
            animation-delay: 6s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-30px) scale(1.1); }
        }

        /* Card styles */
        .card {
            background: var(--soft-black);
            border: 1px solid var(--border-gray);
            border-radius: 12px;
            padding: 2rem;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: var(--primary-purple);
            transform: scaleX(0);
            transition: transform 0.4s ease;
        }

        .card:hover::before {
            transform: scaleX(1);
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-purple);
            box-shadow: 0 20px 40px rgba(139, 92, 246, 0.1);
        }

        /* Grid layouts */
        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 2rem;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .grid-4 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 1rem 2rem;
            text-decoration: none;
            border: 1px solid;
            font-weight: 400;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            border-radius: 6px;
        }

        .btn-primary {
            background: var(--primary-purple);
            color: var(--pure-white);
            border-color: var(--primary-purple);
        }

        .btn-primary:hover {
            background: var(--deep-purple);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.3);
        }

        .btn-secondary {
            background: transparent;
            color: var(--pure-white);
            border-color: var(--border-gray);
        }

        .btn-secondary:hover {
            background: var(--primary-purple);
            border-color: var(--primary-purple);
            transform: translateY(-2px);
        }

        /* Footer */
        footer {
            background: var(--charcoal);
            border-top: 1px solid var(--border-gray);
            padding: 3rem;
            text-align: center;
            margin-top: 5rem;
        }

        footer p {
            color: var(--text-gray);
            font-weight: 300;
            font-size: 0.9rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .nav-container {
                padding: 1rem 1.5rem;
                flex-direction: column;
                gap: 1rem;
            }

            .nav-links {
                gap: 1rem;
                flex-wrap: wrap;
                justify-content: center;
            }

            .nav-links a {
                font-size: 0.8rem;
                padding: 0.4rem 0.8rem;
            }

            .section {
                padding: 3rem 1.5rem;
            }

            .section-title {
                font-size: 2rem;
            }

            .grid-2,
            .grid-3,
            .grid-4 {
                grid-template-columns: 1fr;
            }

            .page-content {
                padding-top: 140px;
            }
        }

        /* Page transition animations */
        .page-enter {
            animation: pageEnter 0.6s ease-out;
        }

        @keyframes pageEnter {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="floating-orbs">
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
    </div>

    <nav class="navbar">
        <div class="nav-container">
            <a href="{% url 'website:home' %}" class="logo">&lt;{{ name|lower }}/&gt;</a>
            <ul class="nav-links">
                <li><a href="{% url 'website:home' %}" {% if request.resolver_match.url_name == 'home' %}class="active"{% endif %}>Home</a></li>
                <li><a href="{% url 'website:portfolio' %}" {% if request.resolver_match.url_name == 'portfolio' %}class="active"{% endif %}>Portfolio</a></li>
                <li><a href="{% url 'website:achievements' %}" {% if request.resolver_match.url_name == 'achievements' %}class="active"{% endif %}>Awards</a></li>
                <li><a href="{% url 'website:timeline' %}" {% if request.resolver_match.url_name == 'timeline' %}class="active"{% endif %}>Journey</a></li>
                <li><a href="{% url 'website:blog' %}" {% if request.resolver_match.url_name == 'blog' %}class="active"{% endif %}>Blog</a></li>
                <li><a href="{% url 'website:metrics' %}" {% if request.resolver_match.url_name == 'metrics' %}class="active"{% endif %}>Metrics</a></li>
                <li><a href="{% url 'website:booking' %}" {% if request.resolver_match.url_name == 'booking' %}class="active"{% endif %}>Book</a></li>
                <li><a href="{% url 'website:resources' %}" {% if request.resolver_match.url_name == 'resources' %}class="active"{% endif %}>Resources</a></li>
                <li><a href="{% url 'website:turnitin' %}" {% if request.resolver_match.url_name == 'turnitin' %}class="active"{% endif %}>Turnitin</a></li>
            </ul>
        </div>
    </nav>

    <main class="page-content page-enter">
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>&copy; 2024 {{ name }}. Crafted with precision and passion.</p>
    </footer>

    <script>
        // Enhanced mouse trail effects
        let mouseTrail = [];
        let trailActive = true;
        
        document.addEventListener('mousemove', (e) => {
            if (!trailActive || window.innerWidth <= 768) return;
            
            // Create trail particle
            if (Math.random() < 0.2) {
                createTrailParticle(e.clientX, e.clientY);
            }
        });
        
        function createTrailParticle(x, y) {
            const particle = document.createElement('div');
            const size = 3 + Math.random() * 3;
            
            particle.style.position = 'fixed';
            particle.style.left = x + 'px';
            particle.style.top = y + 'px';
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.background = 'var(--primary-purple)';
            particle.style.borderRadius = '50%';
            particle.style.pointerEvents = 'none';
            particle.style.zIndex = '9999';
            particle.style.opacity = '0.6';
            particle.style.boxShadow = `0 0 ${size * 2}px var(--primary-purple)`;
            particle.style.transition = 'all 0.8s ease-out';
            
            document.body.appendChild(particle);
            
            requestAnimationFrame(() => {
                particle.style.opacity = '0';
                particle.style.transform = `scale(0) translateY(-20px)`;
            });
            
            setTimeout(() => particle.remove(), 800);
        }

        // Smooth navbar scroll effect
        window.addEventListener('scroll', () => {
            const navbar = document.querySelector('.navbar');
            if (window.scrollY > 50) {
                navbar.style.background = 'rgba(0, 0, 0, 0.98)';
                navbar.style.borderBottomColor = 'var(--primary-purple)';
            } else {
                navbar.style.background = 'rgba(0, 0, 0, 0.95)';
                navbar.style.borderBottomColor = 'var(--border-gray)';
            }
        });

        // Add entrance animations
        const animateOnScroll = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = '1';
                    entry.target.style.transform = 'translateY(0)';
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.card').forEach(el => {
            el.style.opacity = '0';
            el.style.transform = 'translateY(30px)';
            el.style.transition = 'all 0.6s ease';
            animateOnScroll.observe(el);
        });

        // Toggle trail effect on key press (T key)
        document.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 't') {
                trailActive = !trailActive;
                console.log('Mouse trail:', trailActive ? 'ON' : 'OFF');
            }
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
